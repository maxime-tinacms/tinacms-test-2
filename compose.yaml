services:
  claude:
    image: sigmapix/claude-code:2.1.44
    profiles: [claude-code]
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ./docker/.claude:/home/node/.claude
      - /var/run/docker.sock:/var/run/docker.sock

  dev:
    image: node:22-alpine
    profiles: [dev]
    ports:
      - "4321:4321"
      - "4001:4001"
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env
    command: sh -c "apk add --no-cache git && npx tinacms dev -c 'astro dev --host 0.0.0.0 --force'"

  node:
    image: node:22-alpine
    profiles: [node]
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build"
